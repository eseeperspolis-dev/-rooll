<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#667085;--bd:#dde1e7;--ac:#0b5fff;--top:#0a7d4f;--bot:#b4540a;--both:#6b3fd1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101317;--card:#1a1f26;--tx:#e8ebef;--mu:#98a2b3;--bd:#2c333d;--ac:#6ea0ff;--top:#4cd49a;--bot:#ffa45c;--both:#b79cff;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,system-ui,sans-serif;padding:14px;max-width:560px;margin-inline:auto}
h1{font-size:18px;margin:4px 0 12px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:4px}
input{width:100%;font-size:22px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);direction:ltr;text-align:center}
.row{display:flex;gap:10px}.row>div{flex:1}
.chips{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:20px;padding:6px 12px;font-size:13px;font-family:inherit}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.g{border-inline-start:4px solid var(--c);}
.g h2{margin:0 0 6px;font-size:17px;direction:ltr;text-align:right}
.g h2 small{font-size:12px;color:var(--mu);font-weight:normal}
.s{display:inline-block;font-size:11px;color:#fff;background:var(--c);border-radius:6px;padding:1px 7px;margin-inline-end:6px}
.it{padding:6px 0;border-top:1px solid var(--bd);font-size:14px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.it:first-of-type{border-top:0}.en{direction:ltr;color:var(--mu);font-size:12px}
.none{text-align:center;color:var(--mu);padding:20px}
.note{font-size:11px;color:var(--mu);line-height:1.8}
.di{width:84px!important;font-size:15px!important;padding:5px!important}.pp{direction:ltr;min-width:70px;text-align:left;font-weight:bold}.sect{font-size:13px;color:var(--mu);margin:12px 4px 4px}
#main[hidden],#ed[hidden]{display:none}
</style></head><body>
<h1>موقعیت غلتک از روی گام اثر (mm)</h1>
<button class="chip" id="eb" style="margin-bottom:10px">✏️ ویرایش قطر غلتک‌ها</button>
<div id="main">
<div class="box">
<div class="row"><div><label>گام اندازه‌گیری‌شده (mm)</label><input id="p" type="number" inputmode="decimal" step="0.1" placeholder="مثلاً 1269.2"></div>
<div><label>خطا ± (mm)</label><input id="t" type="number" inputmode="decimal" step="0.5" value="3"></div></div>
<div style="margin-top:10px"><label>جستجو بر اساس نام غلتک (مثلاً bridle یا اسیدی)</label><input id="q" type="text" style="font-size:16px;direction:rtl" placeholder="نام غلتک"></div><div class="chips" id="f"><button class="chip on" data-v="all">همه</button><button class="chip" data-v="t">روی ورق</button><button class="chip" data-v="b">زیر ورق</button><button class="chip" data-v="x">روی و زیر</button></div>
</div>

<div id="out"></div>

</div>

const N={t:'روی ورق',b:'زیر ورق',x:'روی و زیر'},C={t:'var(--top)',b:'var(--bot)',x:'var(--both)'};
let flt='all';
const $=id=>document.getElementById(id);
function render(){
 const v=parseFloat($('p').value),tol=Math.abs(parseFloat($('t').value))||0,o=$('out');
 $('pv').textContent=isNaN(v)?'گام':v+' mm';$('dv').textContent=isNaN(v)?'':'قطر ≈ '+(v/Math.PI).toFixed(1)+' mm';
 const nz=s=>s.toLowerCase().replace(/[\u200c\s]/g,''),q=nz($('q').value);
 if(q){const rs=D.filter(r=>!(r[2]=='—'&&!r[3])&&(flt=='all'||r[1]==flt)&&nz(r[2]+r[3]).includes(q));
  $('pv').textContent=rs.length?rs[0][0]+' mm':'گام';$('dv').textContent=rs.length?'قطر ≈ '+(rs[0][4]||(rs[0][0]/Math.PI).toFixed(1))+' mm':'';
  o.innerHTML=rs.length?rs.map(r=>'<div class="box g" style="--c:'+C[r[1]]+'"><div><span class="s">'+N[r[1]]+'</span><b>'+(r[3]||'—')+'</b> <span class="en">'+r[2]+'</span></div><div style="margin-top:6px;direction:ltr;text-align:right">گام <b>'+r[0]+'</b> mm · قطر <b>'+(r[4]||(r[0]/Math.PI).toFixed(1))+'</b> mm</div></div>').join(''):'<div class="box none">غلتکی با این نام پیدا نشد</div>';return}
 if(isNaN(v)){o.innerHTML='<div class="none">گام را وارد کنید</div>';return}
 const rows=D.filter(r=>!(r[2]=='—'&&!r[3])&&Math.abs(r[0]-v)<=tol&&(flt=='all'||r[1]==flt));
 if(!rows.length){
  const u=[...new Set(D.map(r=>r[0]))].sort((a,b)=>Math.abs(a-v)-Math.abs(b-v))[0];
  o.innerHTML='<div class="box none">موردی در بازه نبود. نزدیک‌ترین گام: <b dir="ltr">'+u+'</b></div>';return}
 const g={};rows.forEach(r=>(g[Math.round(r[0])]=g[Math.round(r[0])]||[]).push(r));
 o.innerHTML=Object.keys(g).sort((a,b)=>Math.abs(a-v)-Math.abs(b-v)).map(k=>{
  const pk=g[k].reduce((x,r)=>x+r[0],0)/g[k].length,d=pk-v,sd=(d>0?'+':'')+d.toFixed(1);
  const bySide=['t','b','x'].map(s=>{const l=g[k].filter(r=>r[1]==s);if(!l.length)return'';
   return '<div style="--c:'+C[s]+'"><div style="margin:8px 0 2px"><span class="s">'+N[s]+'</span>'+l.length+' مورد</div>'+
   l.map(r=>'<div class="it"><b>'+(r[3]||'—')+'</b><span class="en">'+r[2]+(r[4]?' · Ø'+r[4]:'')+'</span></div>').join('')+'</div>'}).join('');
  return '<div class="box g" style="--c:var(--ac)"><h2>'+pk.toFixed(1)+' <small>(اختلاف '+sd+')</small></h2>'+bySide+'</div>'}).join('');
}
$('p').oninput=$('t').oninput=$('q').oninput=render;
$('f').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;flt=b.dataset.v;[...$('f').children].forEach(c=>c.classList.toggle('on',c==b));render()};

// ---- ویرایش قطر ----
const LS='rollpitch_diam_v1',pitchOf=d=>Math.round(Math.PI*d*10)/10;
const bD=D.map(r=>r[4]),bP=D.map(r=>r[0]);let ov={};
try{ov=JSON.parse(localStorage.getItem(LS)||'{}')||{}}catch(e){ov={}}
function applyOv(){D.forEach((r,i)=>{if(r.length>4&&ov[i]>0){r[4]=ov[i];r[0]=pitchOf(ov[i])}})}
applyOv();
const stt=t=>{$('st').textContent=t};
function edRender(){const f=($('eq').value||'').toLowerCase().replace(/[\u200c\s]/g,'');let sec='',h='';
 D.forEach((r,i)=>{if(r.length<5)return;if(f&&!(r[2]+r[3]).toLowerCase().replace(/[\u200c\s]/g,'').includes(f))return;
  if(r[3]!==sec){sec=r[3];h+='<div class="sect">'+sec+'</div>'}
  h+='<div class="box" style="padding:8px 10px;margin-bottom:6px"><div class="it" data-i="'+i+'" style="border:0;padding:0;align-items:center"><span class="s" style="--c:'+C[r[1]]+'">'+N[r[1]]+'</span><span class="en" style="flex:1;min-width:130px">'+r[2]+'</span><input class="di" type="number" inputmode="decimal" step="0.1" value="'+r[4]+'"><span class="pp">'+r[0].toFixed(1)+'</span></div></div>'});
 $('el').innerHTML=h||'<div class="none">موردی نیست</div>'}
$('el').addEventListener('input',e=>{const t=e.target;if(!t.classList.contains('di'))return;
 const it=t.closest('.it'),i=+it.dataset.i,d=parseFloat(t.value);if(!(d>0))return;
 D[i][4]=d;D[i][0]=pitchOf(d);ov[i]=d;it.querySelector('.pp').textContent=D[i][0].toFixed(1);stt('تغییرات ذخیره‌نشده — دکمهٔ ذخیره را بزنید')});
$('eq').oninput=edRender;
$('eb').onclick=()=>{const o=$('ed').hidden;$('ed').hidden=!o;$('main').hidden=o;$('eb').textContent=o?'↩ بازگشت به جستجو':'✏️ ویرایش قطر غلتک‌ها';if(o)edRender();else render()};
$('sv').onclick=()=>{try{localStorage.setItem(LS,JSON.stringify(ov));stt('ذخیره شد ✓ (در همین مرورگر)')}catch(e){stt('ذخیره در این مرورگر ممکن نشد؛ از «خروجی پشتیبان» استفاده کنید')}};
$('rs').onclick=()=>{if(!confirm('همهٔ قطرها به مقدار پیش‌فرض برگردد؟'))return;ov={};try{localStorage.removeItem(LS)}catch(e){}D.forEach((r,i)=>{if(r.length>4){r[4]=bD[i];r[0]=bP[i]}});edRender();stt('به پیش‌فرض برگشت')};
$('ex').onclick=()=>{$('bk').hidden=false;$('bk').value=JSON.stringify(ov);$('bk').select();stt('این متن را کپی و جایی نگه دارید')};
$('im').onclick=()=>{if($('bk').hidden){$('bk').hidden=false;$('bk').value='';stt('متن پشتیبان را بچسبانید و دوباره «ورود پشتیبان» بزنید');return}
 try{const o=JSON.parse($('bk').value);if(typeof o!=='object')throw 0;D.forEach((r,i)=>{if(r.length>4){r[4]=bD[i];r[0]=bP[i]}});ov=o;applyOv();edRender();stt('وارد شد؛ برای ماندگاری ذخیره را بزنید')}catch(e){stt('متن پشتیبان معتبر نیست')}};
render();
</script><script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
